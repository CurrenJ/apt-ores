# The item-shadow overlay models (assets/aptores/items/overlay_*.json) bake into a
# BlockStateModelWrapper whose wrapped BlockStateModel is a private field. We need it to
# emit the overlay parts at mesh time, so expose it.
# NOTE: Loom consumes this file at BUILD time to transform the minecraft artifacts (compile
# classpath + merged dev jar). It also ships in the mod jar; FML re-reads it at runtime with the
# naming service pinned to identity (see forge/build.gradle runClient jvmArgs), which is a no-op
# because the field is already public. Do not re-add a processResources exclude: it is not needed
# and it breaks the production shadowJar.
public net.minecraft.client.renderer.block.model.BlockStateModelWrapper model
# MC 26.1 bakes a "minecraft:model" item definition that points at a block model into a
# CuboidItemModelWrapper (pre-baked quad collection) instead of the 1.21.4-era BlockStateModelWrapper.
# We read those quads back out to rebuild the overlay as a BlockStateModel.
public net.minecraft.client.renderer.item.CuboidItemModelWrapper quads
