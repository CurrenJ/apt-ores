modLoader = "javafml"
loaderVersion = "[52,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''
logoFile = "${mod_icon}"

[[dependencies.aptores]]
modId = "forge"
mandatory = true
versionRange = "${mod_forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.aptores]]
modId = "minecraft"
mandatory = true
versionRange = "${mod_minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
