plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    developmentForge.extendsFrom common
    // NOT runtimeClasspath: Loom's Forge dev launcher merges developmentForge's classpath
    // (including common, via the line above) into one synthetic "generated_XXX" module so the
    // TRANSFORMER layer gets a single, self-consistent copy of :common's classes. Separately
    // extending plain runtimeClasspath from common puts a second, independently-loaded copy of
    // grill24.aptores on the classpath used to build the parent SECURE-BOOTSTRAP module layer -
    // colliding with the merged copy as a JPMS split package (java.lang.module.ResolutionException:
    // "Modules aptores.common.dev and generated_XXX export package grill24.aptores") since both
    // land in module layers that get resolved together at JVM bootstrap.

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.minecraft_version-$rootProject.forge_version"

    // namedElements no longer exists in loom-no-remap; reference common directly.
    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    from project(":common").sourceSets.main.resources

    filesMatching('META-INF/mods.toml') {
        expand([
            'version': project.version,
            'mod_license': rootProject.mod_license,
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_authors': rootProject.mod_authors,
            'mod_description': rootProject.mod_description,
            'mod_icon': rootProject.mod_icon,
            'mod_forge_version_range': "[${rootProject.forge_version},)",
            'mod_minecraft_version_range': "[${rootProject.minecraft_version},)"
        ])
    }
}

// loom-no-remap: remapJar is gone. Mark the default jar as raw so shadowJar can build on
// top of the Loom-processed output, then make shadowJar (which bundles :common via
// shadowBundle) the primary artifact.
jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()           // don't re-include source set output directly
    from(zipTree(jar.archiveFile))         // unpack the Loom-processed jar as the base
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null               // shadowJar becomes the primary artifact
}

// Redirect components.java to publish the shadow jar instead of the plain jar.
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

// Forge dev runtime: keep the mod on a SINGLE classpath entry. With classes and resources as
// two separate dirs, Forge's SecureModuleFinder unions them into a `union:` URL; ClasspathLocator
// can't turn that into a valid module name (empty name) and FML dies at bootstrap. Merging the
// resources output into the classes dir means :forge:runClient sees one entry per module.
sourceSets {
    main {
        output.resourcesDir = output.classesDirs.singleFile
    }
}

sourceSets.main.resources.srcDir("src/main/generated")

loom {
    runs {
        data {
            data()
            programArgs "--mod", "aptores",
                        "--all",
                        "--output", file("src/main/generated").absolutePath
        }
    }
}
