# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 0.1.0
mod_description = Ores visually take on the material touching them. Purely a client-side rendering effect - no blocks, block entities, or worldgen are replaced.
mod_id = aptores
mod_name = Apt Ores
mod_authors = Curren
mod_license = CC0-1.0
mod_icon = icon.png
mod_neoforge_version_range = [${neoforge_version},)
mod_forge_version_range = [${forge_version},)
mod_minecraft_version_range = [${minecraft_version},)
mod_fabric_minecraft_version = ~${minecraft_version}
maven_group = grill24.aptores
archives_name = aptores
enabled_platforms = fabric,neoforge,forge

# Minecraft properties
minecraft_version=1.21.6

# Dependencies
architectury_api_version = 17.0.6
fabric_loader_version = 0.19.3
fabric_api_version = 0.128.2+1.21.6
neoforge_version = 21.6.20-beta
forge_version = 56.0.8
