plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API - specifically the Indigo/Renderer API this mod uses to hook model baking.
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // namedElements no longer exists in loom-no-remap; reference common directly.
    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    dependsOn ':common:processResources'
    inputs.property 'version', project.version

    from project(":common").sourceSets.main.resources

    filesMatching('fabric.mod.json') {
        expand([
            'version': project.version,
            'mod_id': rootProject.mod_id,
            'mod_name': rootProject.mod_name,
            'mod_description': rootProject.mod_description,
            'mod_authors': rootProject.mod_authors,
            'mod_license': rootProject.mod_license,
            'mod_icon': rootProject.mod_icon,
            'mod_fabric_minecraft_version': "~${rootProject.minecraft_version}"
        ])
    }
}

// loom-no-remap: remapJar is gone. Mark the default jar as raw so shadowJar can build on
// top of the Loom-processed output, then make shadowJar (which bundles :common via
// shadowBundle) the primary artifact.
jar {
    archiveClassifier = 'raw'
}

shadowJar {
    dependsOn(jar)
    mainSpec.sourcePaths.clear()           // don't re-include source set output directly
    from(zipTree(jar.archiveFile))         // unpack the Loom-processed jar as the base
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null               // shadowJar becomes the primary artifact
}

// Redirect components.java to publish the shadow jar instead of the plain jar.
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

loom {
    runs {
        datagen {
            inherit client
            name = "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=aptores"

            runDir "build/datagen"
        }
    }
}
